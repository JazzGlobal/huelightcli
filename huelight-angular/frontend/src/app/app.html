<div class="app">
  <header class="app-header">
    <h1>Hue Light Controller</h1>
  </header>

  <main class="app-content">
    <p>App is running.</p>
    <div class="row">
      <div class="col-md-4"></div>
      <div class="col-md-4">
        @for (item of lights(); track item.id) {
          <app-widget-frame title="Light {{item.id}}: {{item.name}}" description="this is a description">
            <p>On: {{item.state.on}}</p>
            <p>Brightness: {{item.state.bri}}</p>
            <p>Hue: {{item.state.hue}}</p>
            <p>Saturation: {{item.state.sat}}</p>
          </app-widget-frame>
          <br>
        }
      </div>
      <div class="col-md-4"></div>
    </div>

    <!-- Router outlet goes here when you add pages -->
    <router-outlet></router-outlet>
  </main>
</div>
